name: CI/CD for prod

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-22.04

    steps:
      - name: 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: application.yml 생성 (dev)
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.CICD_APPLICATION }}" > ./src/main/resources/application.yml

      - name: 빌드
        run: |
          chmod +x gradlew
          ./gradlew -x test clean build
        shell: bash

      - name: jar 파일명 변경
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          cp "$JAR_FILE" server.jar
          ls -al server.jar

      - name: 서버 배포 디렉터리 생성
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            mkdir -p ~/app

      - name: jar 파일 서버 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "server.jar"
          target: "~/app"

      - name: 서버에서 애플리케이션 재시작
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            mkdir -p ~/app
            mkdir -p ~/app/logs
            cd ~/app

            echo "기존 애플리케이션 종료"
            if [ -f app.pid ]; then
              PID=$(cat app.pid)
              if ps -p "$PID" > /dev/null 2>&1; then
                kill "$PID" || true
                sleep 5
              fi
              rm -f app.pid
            fi

            echo "남아있는 server.jar 프로세스 정리"
            OLD_PIDS=$(ps -eo pid=,comm=,args= | awk '$2 == "java" && $0 ~ /server.jar/ {print $1}')

            if [ -n "$OLD_PIDS" ]; then
              for PID in $OLD_PIDS; do
                echo "Kill old process: $PID"
                kill "$PID" || true
              done
              sleep 5
            fi

            echo "새 애플리케이션 실행"
            nohup java -jar /home/ubuntu/app/server.jar \
              > /home/ubuntu/app/logs/spring-boot-application.log \
              2> /home/ubuntu/app/logs/spring-boot-application-error.log &

            echo $! > /home/ubuntu/app/app.pid

            sleep 10

            echo "실행 중인 프로세스 확인"
            if ps -p $(cat /home/ubuntu/app/app.pid) > /dev/null 2>&1; then
              echo "Application started successfully."
            else
              echo "Application failed to start."
              echo "에러 로그:"
              tail -n 100 /home/ubuntu/app/logs/spring-boot-application-error.log || true
              exit 1
            fi

            echo "최근 로그"
            tail -n 50 /home/ubuntu/app/logs/spring-boot-application.log || true
