name: CI/CD for prod

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-22.04

    steps:
      - name: 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: application.yml 생성 (dev)
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.CICD_APPLICATION }}" > ./src/main/resources/application.yml

      - name: 빌드
        run: |
          chmod +x gradlew
          ./gradlew -x test clean build
        shell: bash

      - name: jar 파일명 변경
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          cp "$JAR_FILE" server.jar
          ls -al server.jar

      - name: 서버 배포 디렉터리 생성
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            mkdir -p ~/app

      - name: jar 파일 서버 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "server.jar"
          target: "~/app"

      - name: 서버에서 애플리케이션 재시작
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app

            echo "기존 애플리케이션 종료"
            if [ -f app.pid ]; then
              PID=$(cat app.pid)
              if ps -p "$PID" > /dev/null 2>&1; then
                kill "$PID" || true
                sleep 3
              fi
              rm -f app.pid
            fi

            echo "남아있는 server.jar 프로세스 정리"
            OLD_PID=$(pgrep -f "java.*server.jar" || true)
            if [ -n "$OLD_PID" ]; then
              kill -9 $OLD_PID || true
            fi

            echo "새 애플리케이션 실행"
            nohup java -jar server.jar \
              > spring-boot-application.log \
              2> spring-boot-application-error.log &

            echo $! > app.pid

            sleep 5

            echo "실행 중인 프로세스 확인"
            ps -ef | grep server.jar | grep -v grep

            echo "최근 로그"
            tail -n 50 spring-boot-application.log || true
